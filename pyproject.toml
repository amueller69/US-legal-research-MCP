[project]
name = "legal-mcp"
version = "0.1.0"
description = "MCP server for structured and semantic access to federal legal resources"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
legal-mcp = "legal_mcp.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
